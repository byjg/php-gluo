# The database server is in docker-compose.database.yml (none for SQLite, whose databases
# are files in db/). The API reaches it by its service name: `gluo-database`.
include:
  - docker-compose.database.yml

services:
  rest:
    image: resttest:dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    ports:
      - "8080:80"
    volumes:
      # The PHP app root is the repository root, so the whole repo is mounted.
      # Only src/, config/, public/, db/, templates/ and builder/ are read by
      # the app; frontend/ and docs/ ride along harmlessly in dev.
      - .:/srv/
    environment:
      - APP_ENV=dev
      # In the container the database is the gluo-database service; config/dev/credentials.env
      # has 127.0.0.1, for the commands run on the host. The tests keep their own database.
      - DBDRIVER_CONNECTION=mysql://root:mysqlp455w0rd@gluo-database/localdev
      - PHP_FPM_SERVER=0.0.0.0:9000
      - VERBOSE=true
    networks:
      - net

  # >>> frontend-service
  frontend:
    image: gluo-frontend:dev
    build:
      context: .
      dockerfile: docker/Dockerfile-html
    # Injected into /config.js at container start so the SPA targets the API
    # without a rebuild. Must be reachable from the browser (host), not the
    # internal service name — the API is published on the host at :8080.
    environment:
      API_BASE_URL: "http://localhost:8080"
    ports:
      - "7080:8080"
      # HTTPS: byjg/static-httpserver also listens on 8443 with a self-signed
      # certificate it generates at start. Mount cert.pem/key.pem at /certs to use your own.
      - "7443:8443"
    networks:
      - net
  # <<< frontend-service

networks:
  net:
